    validation: 0.10
    test: 0.10
  seed: 20260728
leakage:
  benchmark_registry: configs/benchmarks/official_benchmark_registry.yaml
  fail_on_overlap: true
normalization:
  counts: raw_integer_counts
  log1p: log1p_cp10k
outputs:
  plan_dir: /home/3159436/sc2/data/census_curated_pretrain_pilot250k/plan
  materialized_dir: /home/3159436/sc2/data/census_curated_pretrain_pilot250k/shards
  manifest: /home/3159436/sc2/data/census_curated_pretrain_pilot250k/shards.parquet
