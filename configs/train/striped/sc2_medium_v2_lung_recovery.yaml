run_name: sc2_medium_v2_lung_recovery
seed: 42
device: auto

data:
  bulk_h5_path: raw/archs4/human_gene_v2.5.h5
  bulk_manifest_path: processed/manifests/archs4_lung_large_pilot_manifest.parquet
  sc_h5ad_path: raw/census/census_large_lung_12ds_2500cpd.h5ad
  sc_split_manifest_path: processed/splits/census_large_lung_12ds_2500cpd_manifest_with_splits.parquet
  pseudobulk_h5ad_path: processed/pseudobulk/census_large_lung_12ds_2500cpd_pseudobulk.h5ad
  shared_gene_table_path: artifacts/gene_tables/census_archs4_shared_genes.tsv
  n_genes: 4096
  log1p_input: true
  bulk_mask_prob: 0.15
  bulk_noise_std: 0.0
  sc_mask_prob: 0.15
  sc_noise_std: 0.0
  pb_mask_prob: 0.15
  pb_noise_std: 0.0
  bulk_batch_size: 4
  sc_batch_size: 8
  pb_batch_size: 4
  num_workers: 2

model:
  kind: sc2_striped_medium
  n_genes: 4096
  d_model: 128
  n_mamba_blocks: 12
  n_attention_checkpoints: 3
  d_state: 4
  d_conv: 5
  expand: 1
  dropout: 0.10
  bidirectional_mamba: true
  mamba_merge_mode: gate
  top_k: 256
  n_heads: 4
  routed_learned_fraction: 0.50
  expression_score_weight: 0.25
  nonzero_bonus: 0.05
  marker_prior_weight: 0.0
  use_rank_bins: true
  n_rank_bins: 32
  use_depth_token: true
  n_depth_bins: 8
  use_modality_token: true
  n_modalities: 3
  dropout_head: true

train:
  # Load weights only from v1. Optimizer/scheduler state is deliberately reset.
  init_checkpoint_path: sc2_medium_lung_large/checkpoints/best.pt

  # Recovery loss. The synthetically hidden nonzeros are the primary target.
  masked_positive_weight: 4.0
  observed_nonzero_weight: 1.0
  zero_regularization_weight: 0.05
  zero_margin: 0.05
  smooth_l1_beta: 0.20

  # Keep the useful v1 dropout signal, but do not let it dominate value recovery.
  dropout_loss_weight: 0.10

  # Preserve bulk and pseudobulk knowledge at low weight.
  # There is intentionally no ARCHS4-to-Census latent alignment term because
  # these are not matched biological samples.
  bulk_loss_weight: 0.25
  pb_loss_weight: 0.25
  pb_every: 4

  upper_mamba_blocks: 4
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  grad_accum_steps: 2
  save_every_steps: 25
  amp: true
  amp_dtype: bfloat16

  # A checkpoint must recover expression variance before it can be considered best.
  min_std_ratio_for_best: 0.20
  zero_fill_threshold: 0.10

  stages:
    - name: head_rescue
      epochs: 1
      steps_per_epoch: 120
      train_groups: [heads]
      lr_heads: 0.0003
      lr_upper: 0.0
      lr_base: 0.0

    - name: upper_adaptation
      epochs: 2
      steps_per_epoch: 180
      train_groups: [heads, upper]
      lr_heads: 0.0001
      lr_upper: 0.00003
      lr_base: 0.0

    - name: full_refine
      epochs: 1
      steps_per_epoch: 150
      train_groups: [heads, upper, base]
      lr_heads: 0.00002
      lr_upper: 0.00002
      lr_base: 0.00001
