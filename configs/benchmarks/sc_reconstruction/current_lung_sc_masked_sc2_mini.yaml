eval_name: "benchmark_current_lung_sc_masked_sc2_mini"
seed: 42
device: "auto"

data:
  h5ad_path: "raw/census/census_large_lung_12ds_2500cpd.h5ad"
  split_manifest_path: "processed/splits/census_large_lung_12ds_2500cpd_manifest_with_splits.parquet"
  shared_gene_table_path: "artifacts/gene_tables/census_archs4_shared_genes.tsv"
  split: "test"
  split_col: "split"
  n_genes: 4096
  log1p_input: true
  batch_size: 64
  num_workers: 4

model:
  kind: "sc2_striped_mini"
  d_model: 128
  n_mamba_blocks: 6
  n_attention_checkpoints: 2
  d_state: 8
  d_conv: 5
  expand: 1
  dropout: 0.1
  top_k: 256
  use_rank_bins: false
  n_rank_bins: 16

eval:
  checkpoint_path: "sc2_mini_lung_large/checkpoints/best.pt"

benchmark:
  modality: "sc"
  mask_probs: [0.15, 0.30, 0.50]
  nonzero_only: true
  zero_fill_threshold: 0.1